schema_version: "1.1"
name: mold-po-stamp-duty-deposit
expected_outcome: |
  Identifies the PO as likely hire of work (จ้างทำของ) subject to stamp duty 1 baht per 1,000 (250 baht) paid by the contractor, notes the sale vs hire-of-work judgement, records the deposit with input VAT from a tax invoice, applies the deposit at final billing, and addresses WHT on the hire-of-work payment.
